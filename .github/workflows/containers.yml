name: Build and Push Container Images

on:
  push:
    branches: [main, master, dev]
    tags: ['v*']
  pull_request:
    branches: [main, master, dev]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository }}

jobs:
  build-backend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version from package.json
        id: version
        run: echo "VERSION=$(jq -r '.version' package.json)" >> $GITHUB_OUTPUT

      - name: Determine tags
        id: tags
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAGS="${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/backend:${{ github.sha }}"
            TAGS="$TAGS,${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/backend:${{ steps.version.outputs.VERSION }}"
            TAGS="$TAGS,${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/backend:latest"
          elif [[ "${{ github.ref }}" == refs/heads/dev ]]; then
            TAGS="${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/backend:${{ github.sha }}"
            TAGS="$TAGS,${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/backend:dev"
          else
            TAGS="${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/backend:${{ github.sha }}"
            TAGS="$TAGS,${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/backend:${{ steps.version.outputs.VERSION }}"
            TAGS="$TAGS,${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/backend:latest"
          fi
          echo "TAGS=$TAGS" >> $GITHUB_OUTPUT

      - name: Pull base image from GHCR
        run: |
          docker pull ${{ env.REGISTRY }}/oliveagle/vibe-kanban/base:v${{ steps.version.outputs.VERSION }}

      - name: Build and Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          target: prod-runtime
          build-args: |
            BASE_IMAGE=${{ env.REGISTRY }}/oliveagle/vibe-kanban/base:v${{ steps.version.outputs.VERSION }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.tags.outputs.TAGS }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
