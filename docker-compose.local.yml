services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.local.backend
    image: vibe-kanban:local-backend
    container_name: vibe-kanban-backend
    user: "0:0"
    ports:
      - "0.0.0.0:37825:3000"
    environment:
      - HOST=0.0.0.0
      - PORT=3000
      - VK_SHARED_API_BASE=http://backend:3000
    volumes:
      - ${HOME}/repos:/repos:ro
      - ${HOME}/data:/app/data:rw
      - ${HOME}/workspace:/workspace:ro
      - ${HOME}/.claude:/root/.claude:ro
      - backend-data:/root/.local/share/vibe-kanban
      - backend-cache:/root/.cache/vibe-kanban
      - ${HOME}/.config/opencode/opencode.json:/root/.config/opencode/opencode.json:ro
      - opencode-transcripts:/root/.config/opencode/transcripts
      - opencode-todos:/root/.config/opencode/todos
      - opencode-skills:/root/.config/opencode/skills
      - opencode-commands:/root/.config/opencode/commands
      - opencode-cache:/root/.cache/opencode
      - backend-persistent:/root/.persistent
    restart: unless-stopped
    networks:
      - vibe-kanban-net

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.local.frontend
    image: vibe-kanban:local-frontend
    container_name: vibe-kanban-frontend
    ports:
      - "0.0.0.0:37826:80"
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - vibe-kanban-net

volumes:
  backend-data:
  backend-cache:
  backend-persistent:
  opencode-cache:
  opencode-transcripts:
  opencode-todos:
  opencode-skills:
  opencode-commands:

networks:
  vibe-kanban-net:
    driver: bridge
