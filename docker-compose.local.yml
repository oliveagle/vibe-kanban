services:
  vibe-kanban:
    # 生产镜像必须从 GHCR 拉取，不允许本地构建
    # 使用 just prod-pull 拉取镜像后再启动
    image: vibe-kanban:local
    container_name: vibe-kanban
    user: "0:0"
    ports:
      - "0.0.0.0:37825:3000"
    environment:
      - HOST=0.0.0.0
      - PORT=3000
      - VK_SHARED_API_BASE=http://localhost:37825
    volumes:
      - ${HOME}/repos:/repos:ro
      - ${HOME}/data:/app/data:rw
      - ${HOME}/workspace:/workspace:ro
      - ${HOME}/.claude:/root/.claude:ro
      - backend-data:/root/.local/share/vibe-kanban
      - backend-cache:/root/.cache/vibe-kanban
      - ${HOME}/.config/opencode/opencode.json:/root/.config/opencode/opencode.json:ro
      - opencode-transcripts:/root/.config/opencode/transcripts
      - opencode-todos:/root/.config/opencode/todos
      - opencode-skills:/root/.config/opencode/skills
      - opencode-commands:/root/.config/opencode/commands
      - opencode-cache:/root/.cache/opencode
      - backend-persistent:/root/.persistent
      - /run/user/1000/podman/podman.sock:/var/run/docker.sock:ro
    restart: unless-stopped

volumes:
  backend-data:
  backend-cache:
  backend-persistent:
  opencode-cache:
  opencode-transcripts:
  opencode-todos:
  opencode-skills:
  opencode-commands:
