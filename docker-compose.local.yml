services:
  backend:
    image: ghcr.io/oliveagle/vibe-kanban/backend:latest
    container_name: vibe-kanban-backend
    user: "0:0"
    ports:
      - "0.0.0.0:37825:3000"
    environment:
      - HOST=0.0.0.0
      - PORT=3000
    volumes:
      - ${HOME}/repos:/repos:ro
      - ${HOME}/data:/app/data:rw
      - ${HOME}/workspace:/workspace:ro
      - ${HOME}/.claude:/root/.claude:ro
      - backend-data:/root/.local/share/vibe-kanban
      - backend-cache:/root/.cache/vibe-kanban
    restart: unless-stopped
    networks:
      - vibe-kanban-net

  frontend:
    image: ghcr.io/oliveagle/vibe-kanban/frontend:latest
    container_name: vibe-kanban-frontend
    ports:
      - "0.0.0.0:37826:80"
    volumes:
      - ./nginx-frontend.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - vibe-kanban-net

volumes:
  backend-data:
  backend-cache:

networks:
  vibe-kanban-net:
    driver: bridge
