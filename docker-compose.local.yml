# Local Production Deployment for Vibe Kanban
# Uses pre-built images from GitHub Container Registry

services:
  vibe-kanban:
    image: vibe-kanban:local
    container_name: vibe-kanban
    ports:
      - "0.0.0.0:37825:3000"
    environment:
      - HOST=0.0.0.0
      - PORT=3000
    volumes:
      - ${HOME}/repos:/repos:ro
      - ${HOME}/workspace:/workspace:ro
      - ${HOME}/.claude:/home/appuser/.claude:ro
      - vibe-kanban-home:/home/appuser
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3

volumes:
  vibe-kanban-home:
